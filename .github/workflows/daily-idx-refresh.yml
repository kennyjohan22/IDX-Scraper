name: Daily IDX Refresh

on:
  schedule:
    - cron: "30 11 * * 1-5" # 18:30 WIB, Monday-Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refresh IDX data
        run: python daily_update.py
        env:
          IDX_INITIAL_BACKFILL_FROM: "2026-03-01"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master.csv.gz screens/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh IDX snapshot"
            git push
          fi
